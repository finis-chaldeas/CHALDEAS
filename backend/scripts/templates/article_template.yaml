# ============================================================
# CHALDEAS Portal Article Template
# ============================================================
# 이 파일을 복사해서 내용을 채우세요.
#
# 사용법:
#   1. 이 파일을 output/ 폴더에 복사
#      cp templates/article_template.yaml output/my-article.yaml
#
#   2. 아래 필드를 채움 (한국어 우선, en/ja는 비워두면 자동번역 가능)
#
#   3. DB에 삽입:
#      python create_portal_article.py --import output/my-article.yaml
#
#   4. 번역이 비어있으면 자동 번역:
#      python create_portal_article.py --import output/my-article.yaml --translate
#
# 자동 생성:
#   python create_portal_article.py --generate "마라톤 전투" --type history
#   → output/ 에 YAML 생성됨 → 검수 후 --import
# ============================================================

# --- 기본 정보 ---

# URL용 고유 ID (영문 kebab-case, 예: warfare-phalanx)
slug: ""

# 콘텐츠 타입
# singularity | lostbelt | servant_column | history | literature | music | essay
item_type: "history"

# --- 제목 (한국어 필수, 나머지 선택) ---

title_ko: ""          # "마라톤의 팔랑크스 — 시민이 제국을 이긴 날"
title: ""              # 영어 (비우면 자동번역)
title_ja: ""           # 일본어 (비우면 자동번역)

# --- 부제목 (선택) ---

subtitle_ko: ""        # "기원전 490년, 아테네 시민군 vs 페르시아 대군"
subtitle: ""
subtitle_ja: ""

# --- 한 줄 설명 (목록에서 보이는 요약) ---

description_ko: ""     # "전문 군인 하나 없는 아테네 시민 1만이 페르시아 2만 5천을 이긴 이야기"
description: ""
description_ja: ""

# --- 메타데이터 ---

era: ""                # "Classical", "Medieval", "Modern" 등
year: 0                # BCE는 음수 (-490 = 490 BCE)
location: ""           # "Marathon, Greece"

# --- 본문 (sections) ---
# 다큐멘터리 에피소드처럼 구성. 5~8 섹션 권장.
#
# 섹션 구조:
#   1. Hook — 놀라운 사실 or 질문 (~100자)
#   2. 배경 — 그 시대는 어떤 곳이었나 (~300자)
#   3. 인물 — 핵심 인물 소개 + 동기 (~400자)
#   4. 전개 — 사건의 흐름 (~500자)
#   5. 전환점 — 이 순간이 모든 걸 바꿨다 (~300자)
#   6. 결과와 영향 — 이게 왜 지금도 중요한가 (~200자)
#   7. FGO 연결 (선택) — 서번트/특이점과 실제 역사 비교

