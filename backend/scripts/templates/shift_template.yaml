# ============================================================
# CHALDEAS History Shift Template
# ============================================================
# 이 파일을 복사해서 내용을 채우세요.
#
# 사용법:
#   1. 이 파일을 output/ 폴더에 복사
#      cp templates/shift_template.yaml output/shift-my-topic.yaml
#
#   2. 아래 필드를 채움 (한국어 우선, English는 비워두면 자동번역 가능)
#
#   3. DB에 삽입:
#      python scripts/create_shift.py --import output/shift-my-topic.yaml
#
#   4. 영어 번역이 비어있으면 자동 번역:
#      python scripts/create_shift.py --import output/shift-my-topic.yaml --translate
#
# 자동 생성:
#   python scripts/create_shift.py --generate "마라톤 전투" --type aggregate
#   → output/ 에 YAML 생성됨 → 검수 후 --import
#
# 주의: 모든 페이지에는 event_id, person_id, location_id, period_id 중
#       최소 1개가 반드시 있어야 합니다 (segment_has_entity 제약).
# ============================================================

# --- 기본 정보 ---

# URL용 고유 ID (영문 kebab-case)
slug: ""

# 시프트 타입: aggregate | person_story | place_story | era_story | causal_chain
chain_type: "aggregate"

# --- 제목 ---

title_ko: ""          # "그리스-페르시아 전쟁"
title: ""              # "Greco-Persian Wars" (비우면 자동번역)

# --- 요약 ---

summary_ko: ""         # 2~3문장 한국어 요약
summary: ""            # 영어 요약 (비우면 자동번역)

# --- Focal Entity (시프트의 주체) ---
# chain_type에 따라 하나만 설정:
#   aggregate: focal_event_id
#   person_story: focal_person_id
#   place_story: focal_location_id
#   era_story: focal_period_id

focal_event_id: null
focal_person_id: null
focal_location_id: null
focal_period_id: null

# --- 시간 범위 ---
# BCE는 음수 (-490 = 490 BCE)

year_start: 0
year_end: null

# --- 표시 설정 ---

globe_importance: 3    # 1~5 (글로브에서의 표시 우선순위)
display_type: "split"  # split | modal
status: "user"         # user | cached | featured | system

# --- 생성 메타데이터 ---

is_auto_generated: false
generation_model: null

# --- 챕터 & 페이지 ---
# 1개 챕터에 3~8페이지 권장. 긴 시프트는 2~4 챕터.
#
# 페이지 구성:
#   sequence: 전체 시프트에서의 순서 (0부터)
#   title/title_ko: 페이지 제목
#   narrative/narrative_ko: 한 줄 요약 (마커에 표시)
#   page_narrative/page_narrative_ko: 본문 (200~400자)
#   event_id/person_id/location_id/period_id: DB 엔티티 링크 (최소 1개 필수!)
#   importance: 1~5
#   transition_type: causes|follows|parallel|background|consequence|enables|opposes
#   transition_strength: 1~5
#   widgets: 위젯 배열 (아래 예시 참조)

chapters:
  - chapter_number: 1
    chapter_title: ""
    chapter_title_ko: ""
    pages:
      - sequence: 0
        title: ""
        title_ko: ""
        narrative: ""
        narrative_ko: ""
        page_narrative: ""
        page_narrative_ko: |
          여기에 한국어 내러티브를 작성.
          200~400자 권장. 현장감 있게.
        year_start: null
        year_end: null
        event_id: null           # DB events.id
        person_id: null          # DB persons.id
        location_id: null        # DB locations.id (좌표 필요)
        period_id: null          # DB periods.id
        importance: 3
        is_keystone: false
        transition_type: null    # 첫 페이지는 null
        transition_strength: null
        widgets: []              # 아래 위젯 예시 참조

      # - sequence: 1
      #   title: "Next Page"
      #   title_ko: "다음 페이지"
      #   ...

# --- Entity Roles (선택) ---
# 시프트에 등장하는 주요 인물/장소/이벤트의 역할.
# role: protagonist | antagonist | supporting | setting | catalyst | witness | context | outcome

entity_roles: []
  # - person_id: 1234
  #   role: "protagonist"
  #   importance: 5
  #   first_appearance: 0       # 처음 등장하는 page sequence

